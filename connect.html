<style>
:root {
  --cyan: #00e5ff;
  --cyan-dim: rgba(0,229,255,0.07);
  --cyan-mid: rgba(0,229,255,0.65);
  --white: #eef5f7;
  --white-dim: rgba(238,245,247,0.65);
  --bg: #020608;
  --border: rgba(0,229,255,0.42);
  --border-thin: rgba(0,229,255,0.34);
  --grid: rgba(0,229,255,0.035);
  --font-display: 'Orbitron', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
html { font-size:112.5%; } /* global text size: 18px base on desktop */
body {
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-mono);
  overflow-x: hidden;
  cursor: none;
  font-size: 17px;
}
a { text-decoration: none; color: inherit; }

/* ── Side vignette ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 4; pointer-events: none;
  background: linear-gradient(to right, rgba(2,6,8,0.7) 0%, transparent 12%, transparent 88%, rgba(2,6,8,0.7) 100%);
}

/* ── BG layers ── */
#field { position:fixed; inset:0; z-index:0; pointer-events:none; }
.grid-overlay {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black 30%, transparent 100%);
}
.scanlines {
  position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.3;
  background: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
}
.noise {
  position:fixed; inset:0; z-index:3; pointer-events:none; opacity:.022;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 128px;
}

/* ── Cursor ── */
#cursor {
  position:fixed; width:7px; height:7px;
  background:var(--cyan); border-radius:50%;
  pointer-events:none; z-index:9999;
  transform:translate(-50%,-50%);
  mix-blend-mode:screen;
  transition: width .15s, height .15s;
}
#cursor-ring {
  position:fixed; width:34px; height:34px;
  border:1px solid var(--cyan-mid); border-radius:50%;
  pointer-events:none; z-index:9998;
  transform:translate(-50%,-50%);
  transition: width .35s cubic-bezier(.23,1,.32,1), height .35s cubic-bezier(.23,1,.32,1), border-color .3s;
}
#cursor-glow {
  position:fixed; width:380px; height:380px;
  background: radial-gradient(circle, rgba(0,229,255,0.09) 0%, transparent 65%);
  pointer-events:none; z-index:9997;
  transform:translate(-50%,-50%);
}
body.hovering #cursor { width:11px; height:11px; }
body.hovering #cursor-ring { width:52px; height:52px; border-color:var(--cyan); }

/* ── Nav ── */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background: rgba(2,6,8,0.97);
  border-bottom: 1px solid rgba(0,229,255,0.12);
  display:flex; align-items:stretch; justify-content:center;
  transition: transform .35s cubic-bezier(.23,1,.32,1), opacity .35s ease;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
nav.nav-hidden { transform:translateY(-100%); opacity:0; pointer-events:none; }
.nav-inner {
  width:100%; max-width:1080px;
  display:flex; align-items:center; justify-content:space-between;
  padding: 18px 0;
}
.nav-logo {
  font-family:var(--font-display); font-weight:700;
  font-size:.88rem; letter-spacing:.25em; color:var(--white);
}
.nav-links { display:flex; gap:32px; list-style:none; }
.nav-links a {
  font-size:.72rem; letter-spacing:.2em;
  color:rgba(238,245,247,0.7);
  transition:color .2s; position:relative;
}
.nav-links a:hover, .nav-links a.active { color:var(--cyan); }
.nav-links a.active::after {
  content:''; position:absolute; bottom:-4px; left:0; right:0;
  height:1px; background:var(--cyan);
}
.nav-right { display:flex; align-items:center; gap:20px; }
.lang-btn {
  font-family:var(--font-mono); font-size:.55rem;
  letter-spacing:.2em; color:var(--cyan);
  background:transparent; border:1px solid var(--border);
  padding:6px 14px; cursor:none;
  transition: background .25s, color .25s;
}
.lang-btn:hover { background:var(--cyan); color:var(--bg); }
.nav-hamburger { display:none; flex-direction:column; gap:5px; cursor:none; }
.nav-hamburger span { width:22px; height:1px; background:var(--white); display:block; }

/* ── Page wrap ── */
.page-wrap {
  max-width:1080px; margin:0 auto;
  position:relative; z-index:10;
  padding: 100px 0 40px;
  display:flex; flex-direction:column; gap:10px;
}

/* ── Section wrap ── */
.section-wrap {
  position:relative; z-index:10;
  border:1px solid var(--border-thin);
}
.section-index { display:none; }

/* ── Section header ── */
.sec-head { text-align:center; padding:48px 0 32px; }
.sec-title-wrap { display:inline-flex; align-items:center; gap:16px; }
.sec-bracket { font-size:1.8rem; color:var(--border); font-family:var(--font-mono); line-height:1; }
.sec-title {
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(1.1rem,2.5vw,1.6rem); letter-spacing:.28em;
}
.sec-sub { margin-top:10px; font-size:.85rem; letter-spacing:.18em; color:var(--cyan); }

/* ── CONNECT — link list (linktree style) ── */
.links { max-width:640px; margin:0 auto; padding:0 20px 40px; display:flex; flex-direction:column; gap:14px; }
.link-card {
  display:block; text-decoration:none; color:var(--white); cursor:none;
  border:1px solid var(--border); background:rgba(0,229,255,0.08);
  box-shadow:inset 0 0 14px rgba(0,229,255,0.07);
  transition:border-color .3s, box-shadow .3s, background .3s;
}
.link-card:hover { border-color:var(--cyan); background:rgba(0,229,255,0.13); box-shadow:0 0 18px rgba(0,229,255,0.38), inset 0 0 14px rgba(0,229,255,0.1); }
.link-card { position:relative; }
.link-title { padding:18px 56px; text-align:center; font-size:.8rem; letter-spacing:.2em; }
.link-card:hover .link-title { color:var(--cyan); }
/* icon on the right: shows where the link goes */
.link-icon {
  position:absolute; right:16px; top:50%; transform:translateY(-50%);
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;
  color:var(--white-dim); transition:color .3s;
}
.link-icon svg { width:100%; height:auto; display:block; }
.link-icon.wide { width:30px; }
.link-card:hover .link-icon { color:var(--cyan); }
/* Small tag sitting on the top border of a link (e.g. BETA) */
.link-tag {
  position:absolute; top:-9px; left:14px;
  font-size:.58rem; letter-spacing:.22em; line-height:1;
  color:var(--cyan); background:var(--bg);
  border:1px solid var(--cyan-mid); padding:3px 0 3px .22em;
  width:4.6em; text-align:center; /* same size for every tag (BETA, NEW…) */
}

/* ── CONNECT — social icons ── */
.connect-socials { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:24px; padding:8px 20px 56px; }
.social-item { display:flex; flex-direction:column; align-items:center; gap:8px; cursor:none; text-decoration:none; color:inherit; }
.social-icon {
  width:48px; height:48px; border:1px solid var(--border-thin); border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  color:var(--white); font-size:1.2rem; transition:.25s;
  background:rgba(0,229,255,0.03);
}
.social-item:hover .social-icon { border-color:var(--cyan); color:var(--cyan); }

/* ══════════════════════════════════════
   JOIN THE SIGNAL (subscribe)
══════════════════════════════════════ */
.nw { white-space:nowrap; }
.join-inner { padding: 0 20px 48px; max-width:640px; margin:0 auto; } /* same width as the link buttons */
.join-form { display:flex; flex-direction:column; gap:14px; }
.join-row { display:grid; grid-template-columns: 1.3fr 1fr auto; gap:10px; }
.join-input {
  font-family:var(--font-mono); font-size:.72rem; letter-spacing:.14em;
  color:var(--white); background:rgba(4,18,22,0.7);
  border:1px solid var(--border-thin); padding:14px 16px;
  outline:none; cursor:none; width:100%;
  transition:border-color .25s, background .25s;
}
.join-input::placeholder { color:rgba(238,245,247,0.45); }
.join-input:focus { border-color:var(--cyan); background:rgba(0,229,255,0.05); }
.join-btn {
  font-family:var(--font-mono); font-size:.72rem; letter-spacing:.3em;
  color:var(--cyan); background:rgba(0,229,255,0.08);
  border:1px solid var(--cyan); padding:14px 30px; cursor:none;
  transition:background .25s, color .25s;
}
.join-btn:hover { background:var(--cyan); color:var(--bg); }
.join-btn:disabled { opacity:.5; }
.join-consent {
  display:flex; align-items:center; gap:10px; cursor:none;
  font-size:.6rem; letter-spacing:.12em; color:var(--white-dim);
}
.join-consent input { accent-color:var(--cyan); width:14px; height:14px; cursor:none; flex-shrink:0; }
.join-hp { position:absolute; left:-9999px; width:1px; height:1px; opacity:0; }
.join-status { min-height:1.2em; font-size:.62rem; letter-spacing:.2em; text-align:center; color:var(--cyan); }
.join-status.error { color:#ff6b81; }
.join-fix { font:inherit; letter-spacing:inherit; color:inherit; background:none; border:none; padding:0; cursor:none; text-decoration:underline; text-underline-offset:3px; }

/* ── Reveal ── */
.reveal { opacity:0; transform:translateY(22px); transition: opacity .9s ease, transform .9s ease; }
.reveal.visible { opacity:1; transform:none; }

/* ── Footer ── */
.footer-bar {
  border-top:1px solid var(--border-thin);
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 20px; font-size:.65rem; letter-spacing:.12em;
  color:rgba(238,245,247,0.7); margin:0;
}
.footer-freq-bars { display:flex; align-items:flex-end; gap:2px; height:16px; }
.fb {
  width:2px; background:var(--cyan); opacity:.35; border-radius:1px;
  animation: barPulse var(--d,.8s) ease-in-out infinite alternate;
  animation-delay:var(--dl,0s);
}
@keyframes barPulse { from{height:2px;opacity:.15} to{height:var(--h,10px);opacity:.6} }
@keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }

/* ── Responsive ── */
@media(max-width:1120px){
  .page-wrap { padding:100px 12px 40px; }
  nav .nav-inner { padding:18px 16px; }
}
@media(max-width:768px){
  html { font-size:125%; } /* global text size: 20px base on mobile */
  .nav-inner { justify-content:center; position:relative; }
  .nav-logo { position:absolute; left:50%; transform:translateX(-50%); margin-left:0; }
  .nav-right { margin-left:auto; margin-right:8px; }
  .page-wrap { padding:90px 8px 32px; }
  nav .nav-inner { padding:22px 12px; }
  .nav-links { display:none; }
  .nav-hamburger { display:flex; }
  .nav-right { gap:10px; }
  .lang-btn { padding:4px 7px; letter-spacing:.1em; }
  .sec-title { font-size:clamp(.9rem,4vw,1.3rem); letter-spacing:.15em; }
  .sec-sub { font-size:.78rem; }
  .links { padding:0 16px 32px; }
  .connect-socials { gap:16px; padding:8px 8px 40px; }
  .join-inner { padding:0 16px 36px; }
  .join-row { grid-template-columns:1fr; }
  .join-btn { width:100%; }
  .join-consent { align-items:flex-start; }
  .footer-bar { flex-direction:column; align-items:center; gap:6px; text-align:center; font-size:.45rem; }
  .footer-freq-bars { order:1; margin-bottom:16px; }
  .footer-bar span:first-child { order:2; }
  .footer-bar span:last-child { order:3; margin-top:0; }
}

/* ── Mobile menu: links always visible, centered under the logo (no hamburger) ── */
@media(max-width:768px){
  .nav-inner { flex-direction:column; align-items:center; gap:22px; padding:14px 12px 10px; position:relative; }
  nav .nav-inner { padding:14px 12px 12px; }
  .nav-logo { position:static; transform:none; margin:0; }
  .nav-logo img { height:34px !important; } /* bigger logo on mobile */
  .nav-right { position:absolute; right:12px; top:12px; margin:0; }
  .nav-hamburger { display:none; }
  .nav-links { display:flex; flex-direction:row; justify-content:center; gap:14px; width:100%; }
  .nav-links a { font-size:.74rem; font-weight:600; letter-spacing:.12em; padding:8px 0; display:inline-block; }
  .nav-links a.active::after { bottom:3px; }
  .page-wrap { padding-top:142px; }
}

/* Touch screens: hide the custom cursor */
html.touch #cursor, html.touch #cursor-ring, html.touch #cursor-glow { display:none; }
/* Touch screens: a tap must not leave a menu link lit (only the current page stays cyan) */
html.touch .nav-links a:not(.active):hover { color:rgba(238,245,247,0.7); }

/* Page change: dark background from the first instant + very short, soft fade between pages */
html { background:#020608; }
@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration:.18s; }
</style>
</head>

<script>
/* Touch screens (phones/tablets): no custom cursor and no hover tricks — avoids needing two taps on iPhone */
const TOUCH = !window.matchMedia('(hover:hover) and (pointer:fine)').matches;
if(TOUCH) document.documentElement.classList.add('touch');
</script>
<script>
/* ── Particle field ── */
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
let W, H;
const mouse = { x:-9999, y:-9999 };
const N = 210, CDIST = 145, MREP = 130;
let pts = [];

function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
function mkPt(){ return { x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35, r:Math.random()*1.3+.4, o:Math.random()*.5+.28 }; }
for(let i=0;i<N;i++) pts.push(mkPt());

function loop(){
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const a=pts[i],b=pts[j];
      const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<CDIST){ ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.strokeStyle=`rgba(0,229,255,${(1-d/CDIST)*.14})`; ctx.lineWidth=.45; ctx.stroke(); }
    }
  }
  pts.forEach(p=>{
    const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<MREP){ const f=(1-d/MREP)*.022; p.vx+=(dx/d)*f*W*.006; p.vy+=(dy/d)*f*H*.006; }
    p.vx*=.982; p.vy*=.982;
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W) p.vx*=-1;
    if(p.y<0||p.y>H) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,229,255,${p.o})`; ctx.fill();
  });
  requestAnimationFrame(loop);
}
loop();
window.addEventListener('resize', resize);

/* ── Cursor ── */
const cur=document.getElementById('cursor');
const ring=document.getElementById('cursor-ring');
const glow=document.getElementById('cursor-glow');
let cx=0,cy=0,rx=0,ry=0;

window.addEventListener('mousemove',e=>{
  cx=e.clientX; cy=e.clientY;
  mouse.x=cx; mouse.y=cy;
  cur.style.left=cx+'px'; cur.style.top=cy+'px';
  glow.style.left=cx+'px'; glow.style.top=cy+'px';
});
(function trackRing(){ rx+=(cx-rx)*.11; ry+=(cy-ry)*.11; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(trackRing); })();
document.querySelectorAll('button,a,.join-consent').forEach(el=>{
  if(!TOUCH) el.addEventListener('mouseenter',()=>document.body.classList.add('hovering'));
  el.addEventListener('mouseleave',()=>document.body.classList.remove('hovering'));
});

/* ════════════════════════════════════
   JOIN THE SIGNAL — subscribe form
   Paste the Apps Script web app URL below when it's ready
════════════════════════════════════ */
const JOIN_URL = 'https://script.google.com/macros/s/AKfycbz12rXYmUB4QOr3FLD3dZ-v6AVo_I_ZuA8mQow6iojN3IYt-x3J6Fn8UjEfhgTxYbfW/exec';
const joinForm   = document.getElementById('joinForm');
const joinBtn    = document.getElementById('joinBtn');
const joinStatus = document.getElementById('joinStatus');

/* Strict format: no spaces, valid characters, real ending like .com / .co */
const EMAIL_RE = /^[a-z0-9._%+\-]+@[a-z0-9\-]+(\.[a-z0-9\-]+)*\.[a-z]{2,}$/i;

/* Common domain typos → correct domain */
const DOMAIN_TYPOS = {
  'gamil.com':'gmail.com','gmial.com':'gmail.com','gmal.com':'gmail.com','gmai.com':'gmail.com',
  'gmil.com':'gmail.com','gnail.com':'gmail.com','gmaill.com':'gmail.com','gmail.co':'gmail.com',
  'gmail.con':'gmail.com','gmail.cm':'gmail.com','gmail.om':'gmail.com','gmail.comm':'gmail.com',
  'hotmial.com':'hotmail.com','hotmal.com':'hotmail.com','hotmai.com':'hotmail.com','hotmil.com':'hotmail.com',
  'hotamil.com':'hotmail.com','hotmail.co':'hotmail.com','hotmail.con':'hotmail.com','hotmail.cm':'hotmail.com',
  'outlok.com':'outlook.com','outloo.com':'outlook.com','outlook.co':'outlook.com','outlook.con':'outlook.com',
  'yahooo.com':'yahoo.com','yaho.com':'yahoo.com','yahoo.con':'yahoo.com','yahoo.cm':'yahoo.com',
  'iclod.com':'icloud.com','icoud.com':'icloud.com','icloud.co':'icloud.com','icloud.con':'icloud.com'
};

/* Shows "DID YOU MEAN @...?" — clicking it fixes the email */
function joinSuggest(fixed){
  joinStatus.textContent = '';
  joinStatus.classList.add('error');
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'join-fix';
  b.textContent = t('DID YOU MEAN @','¿QUISISTE DECIR @') + fixed.split('@')[1].toUpperCase() + '?';
  if(!TOUCH) b.addEventListener('mouseenter',()=>document.body.classList.add('hovering'));
  b.addEventListener('mouseleave',()=>document.body.classList.remove('hovering'));
  b.addEventListener('click',()=>{
    joinForm.elements.email.value = fixed;
    document.body.classList.remove('hovering');
    joinMsg('');
  });
  joinStatus.appendChild(b);
}

function joinMsg(text, isError){
  joinStatus.textContent = text;
  joinStatus.classList.toggle('error', !!isError);
}
joinForm.addEventListener('submit', e=>{
  e.preventDefault();
  const f = joinForm.elements;
  if(f.website.value) return;                                   /* bot trap */
  const email = f.email.value.trim().toLowerCase();
  f.email.value = email;
  if(!EMAIL_RE.test(email)) return joinMsg(t('ENTER A VALID EMAIL','ESCRIBE UN CORREO VÁLIDO'), true);
  const domain = email.split('@')[1];
  if(DOMAIN_TYPOS[domain]) return joinSuggest(email.split('@')[0] + '@' + DOMAIN_TYPOS[domain]);
  const whatsapp = f.whatsapp.value.trim();
  const digits = whatsapp.replace(/\D/g, '');
  if(!/^\+?[\d\s\-().]+$/.test(whatsapp) || digits.length < 7 || digits.length > 15)
    return joinMsg(t('ENTER A VALID WHATSAPP','ESCRIBE UN WHATSAPP VÁLIDO'), true);
  if(!f.consent.checked) return joinMsg(t('PLEASE ACCEPT TO CONTINUE','ACEPTA PARA CONTINUAR'), true);
  if(!JOIN_URL) return joinMsg('NOT CONNECTED YET', true);

  joinBtn.disabled = true;
  joinMsg(t('SENDING...','ENVIANDO...'));
  const data = new URLSearchParams({
    email: email,
    whatsapp: whatsapp,
    page: location.pathname || '/'
  });
  fetch(JOIN_URL, { method:'POST', mode:'no-cors', body:data })
    .then(()=>{ joinForm.reset(); joinMsg(t('SIGNAL RECEIVED // YOU ARE IN','SEÑAL RECIBIDA // YA ESTÁS DENTRO')); })
    .catch(()=> joinMsg(t('TRANSMISSION FAILED — TRY AGAIN','FALLÓ EL ENVÍO — INTENTA DE NUEVO'), true))
    .finally(()=>{ joinBtn.disabled = false; });
});

let lastScroll=0; const navEl=document.querySelector('nav');
window.addEventListener('scroll',()=>{ const c=window.scrollY; if(c>lastScroll&&c>80){navEl.classList.add('nav-hidden');}else{navEl.classList.remove('nav-hidden');} lastScroll=c<=0?0:c; },{passive:true});

/* ── Footer bars ── */
const fb=document.getElementById('footerBars');
[10,14,8,12,16,10,14,8].forEach((h,i)=>{
  const b=document.createElement('div'); b.className='fb';
  b.style.setProperty('--h',h+'px');
  b.style.setProperty('--d',(0.4+Math.random()*.5)+'s');
  b.style.setProperty('--dl',(Math.random()*.4)+'s');
  fb.appendChild(b);
});

/* ── Scroll reveal ── */
const obs=new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); } });
},{threshold:.12});
/* What is already on screen when the page opens appears in place (no slide-up "bounce");
   the animation stays only for sections that appear while scrolling */
document.querySelectorAll('.reveal').forEach(el=>{
  if(el.getBoundingClientRect().top < window.innerHeight){
    el.style.transition = 'none';
    el.classList.add('visible');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transition = ''; }));
  }
});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

/* ── Language: uses the visitor's browser language by default (English if not Spanish);
      the choice is remembered across pages. Menu and section titles stay in English. ── */
const LANG_KEY = 'hologrammLang';
let lang = (function(){
  try { const s = localStorage.getItem(LANG_KEY); if(s === 'en' || s === 'es') return s; } catch(e){}
  return (navigator.language || 'en').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
})();
function t(en, es){ return lang === 'es' ? es : en; }
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-en][data-es]').forEach(el => {
    if(el.closest('nav, .sec-title, .presskit-title, .section-index')) return;
    el.textContent = lang === 'es' ? el.dataset.es : el.dataset.en;
  });
  document.getElementById('langBtn').textContent = lang === 'es' ? 'EN' : 'ES';
}
document.getElementById('langBtn').addEventListener('click', () => {
  lang = lang === 'es' ? 'en' : 'es';
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  applyLang();
});
applyLang();

/* ── Hamburger ── */
const burger=document.getElementById('hamburger');
const navLinksM=document.querySelector('.nav-links');
let menuOpen=false;
burger.addEventListener('click',()=>{
  menuOpen=!menuOpen;
  if(menuOpen){
    navLinksM.style.display='flex';
    navLinksM.style.flexDirection='column';
    navLinksM.style.position='absolute';
    navLinksM.style.top='58px';
    navLinksM.style.left='0';
    navLinksM.style.right='0';
    navLinksM.style.background='rgba(2,6,8,0.98)';
    navLinksM.style.borderBottom='1px solid rgba(0,229,255,0.12)';
    navLinksM.style.padding='20px 24px';
    navLinksM.style.gap='18px';
    navLinksM.style.zIndex='200';
  } else { navLinksM.style.display='none'; }
});
navLinksM.querySelectorAll('a').forEach(a=>{ a.addEventListener('click',()=>{ menuOpen=false; navLinksM.style.display='none'; }); });
</script>
